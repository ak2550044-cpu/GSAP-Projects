<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll to Thrive</title>
    <link rel="stylesheet" href="./scr.css">
</head>
<body>
    <main>
        <section id="page1" class="intro">
            <p class="eyebrow">A STUDY IN FORWARD MOTION</p>
            <h1>Keep going<span>.</span></h1>
            <p class="scroll-note"><span></span> Scroll to move the message</p>
        </section>

        <section id="page2" aria-label="Thrive beyond limits scrolling text">
            <div class="section-meta">
                <span>01 / KEEP MOVING</span>

        </div>
            <div id="move">
                <div class="marquee">
                    <h2>THRIVE BEYOND LIMITS</h2>
                    <span class="asterisk" aria-hidden="true">✳</span>
                    <h2>MAKE YOUR OWN MOMENTUM</h2>
                    <span class="asterisk" aria-hidden="true">✳</span>
                    <h2>THRIVE BEYOND LIMITS</h2>
                    <span class="asterisk" aria-hidden="true">✳</span>
                </div>
            </div>
            <div class="section-meta section-meta-bottom">
                <span>IDEAS IN MOTION</span>
                <span>SCROLL TO CONTINUE</span>
            </div>
        </section>

        <section id="page3" class="outro">
            <p class="eyebrow">THE NEXT PART IS YOURS</p>
            <h2>Make it <span>matter.</span></h2>
            <a href="#page1">BACK TO THE TOP <span aria-hidden="true">↑</span></a>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <script src="./src.js"></script>
